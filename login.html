<!DOCTYPE html>
<html lang="ca" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inici de sessió - Ciro</title>

    <link rel="stylesheet" href="./css/styles.css">
    <!-- Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="min-h-screen flex flex-col justify-between bg-fons">

        <!-- HEADER / NAVIGATION -->
    <header
        class="w-full px-6 py-6 md:px-12 flex justify-end items-center gap-4 md:gap-6 text-xs md:text-sm font-medium border-b border-colorBorderDark/50">
        
        <a href="index.html" class="text-colorTitol hover:text-colorPrimary-hover font-medium text-base underline underline-offset-4 transition-colors">
            Tornar al inici
        </a>
    </header>

    <!-- MAIN CONTENT / LOGIN SECTION -->
    <main class=" flex-grow flex items-center justify-center px-4 py-8 md:py-12">
        <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-center">

            <!-- LEFT COLUMN: FORM CARD -->
            <!-- redondeo -->
            <div class="md:border-2 border-colorBorder rounded-xl card-border p-8 md:p-12 flex flex-col justify-center min-h-[420px]">
                <h1 class="text-2xl md:text-3xl font-serif font-normal text-colorTitol mb-6">
                    Inici de sessió
                </h1>

                <form action="#" method="POST" class="space-y-4">
                    <!-- Correu electrònic -->
                    <div>
                        <label for="email" class="block text-xs text-colorTitol mb-1 font-medium">
                            Correu electrònic
                        </label>
                        <input type="email" id="email" name="email" required
                            class="rounded-xs w-full bg-white border border-colorBorderDark rounded-sm px-3 py-2 text-sm text-colorTitol focus:outline-none focus:ring-1 focus:ring-colorBorder shadow-inner">
                    </div>

                    <!-- Contrasenya -->
                    <div>
                        <label for="password" class="block text-xs text-colorTitol mb-1 font-medium">
                            Contrasenya
                        </label>
                        <input type="password" id="password" name="password" required
                            class="w-full bg-white border border-colorBorderDark rounded-sm px-3 py-2 text-sm text-colorTitol focus:outline-none focus:ring-1 focus:ring-colorBorder shadow-inner">
                    </div>

                    <!-- Botó Accedir -->
                    <div class="pt-2">
                        <button type="submit"
                            class="bg-colorPrimary hover:bg-colorPrimary-hover text-white text-xs font-normal px-6 py-2 rounded transition-colors shadow-sm">
                            Accedir
                        </button>
                    </div>

                    <!-- Vull registrar-me link -->
                    <div class="pt-1">
                        <a href="register.html" class="text-xs text-colorTitol hover:text-colorPrimary-hover underline underline-offset-2 transition-colors">
                            Vull registrar-me
                        </a>
                    </div>
                </form>
            </div>

            <!-- RIGHT COLUMN: IMAGE CARD -->
            <div class="w-full h-full min-h-[350px] md:min-h-[420px] rounded-3xl overflow-hidden shadow-sm border-t border-colorBorderDark/50">
                <img src="images/imageLogin.jpeg" 
                    alt="imagen de joyas Ciro" 
                    class="w-full h-full object-cover object-center"/>
            </div>

        </div>
    </main>

    <footer class="w-full border-t border-colorBorderDark/50 mt-12 pt-12 pb-8 px-6 md:px-12">
    </footer>

</body>

</html>
