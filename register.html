<!DOCTYPE html>
<html lang="ca" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar-me - Ciro</title>

    <link rel="stylesheet" href="./css/styles.css">
    <!-- Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col justify-between bg-brand-bg text-brand-dark">

        <!-- HEADER / NAVIGATION -->
    <header
        class="w-full px-6 py-6 md:px-12 flex justify-end items-center gap-4 md:gap-6 text-xs md:text-sm font-medium border-b border-colorBorderDark/50">
        
        <a href="index.html" class="text-colorTitol hover:text-colorPrimary-hover font-medium text-base underline underline-offset-4 transition-colors">
            Tornar al inici
        </a>
    </header>


    <!-- MAIN CONTENT / REGISTRATION SECTION -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 md:py-12">
        <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-stretch">

            <!-- LEFT COLUMN: FORM CARD -->
            <div class="md:border-2 border-colorBorder rounded-xl card-border p-8 md:p-12 flex flex-col justify-center min-h-[420px]">
                <h1 class="text-2xl md:text-3xl font-serif font-normal text-colorTitol mb-6">
                    Registrar-me
                </h1>

                <form action="javascript:alert('Registre completat!')" method="POST" class="space-y-3.5">
                    <!-- Nom -->
                    <div>
                        <label for="nom" class="block text-xs text-colorTitol mb-1 font-medium">
                            Nom
                        </label>
                        <input type="text" id="nom" name="nom" required
                            class="rounded-xs w-full bg-white border border-colorBorderDark rounded-sm px-3 py-2 text-sm text-colorTitol focus:outline-none focus:ring-1 focus:ring-colorBorder shadow-inner">
                    </div>

                    <!-- Correu electrònic -->
                    <div>
                        <label for="email" class="block text-xs text-colorTitol mb-1 font-medium">
                            Correu electrònic
                        </label>
                        <input type="email" id="email" name="email" required
                            class="rounded-xs w-full bg-white border border-colorBorderDark rounded-sm px-3 py-2 text-sm text-colorTitol focus:outline-none focus:ring-1 focus:ring-colorBorder shadow-inner">
                    </div>

                    <!-- Contrasenya -->
                    <div>
                        <label for="password" class="block text-xs text-colorTitol mb-1 font-medium">
                            Contrasenya
                        </label>
                        <input type="password" id="password" name="password" required
                            class="rounded-xs w-full bg-white border border-colorBorderDark rounded-sm px-3 py-2 text-sm text-colorTitol focus:outline-none focus:ring-1 focus:ring-colorBorder shadow-inner">
                    </div>

                    <!-- Confirma la contrasenya -->
                    <div>
                        <label for="confirm_password" class="block text-xs text-colorTitol mb-1 font-medium">
                            Confirma la contrasenya
                        </label>
                        <input type="password" id="confirm_password" name="confirm_password" required
                            class="rounded-xs w-full bg-white border border-colorBorderDark rounded-sm px-3 py-2 text-sm text-colorTitol focus:outline-none focus:ring-1 focus:ring-colorBorder shadow-inner">
                    </div>

                    <!-- Botó Enviar -->
                    <div class="pt-2">
                        <button type="submit"
                            class="bg-colorPrimary hover:bg-colorPrimary-hover text-colorBtnText text-xs font-normal px-6 py-2 rounded transition-colors shadow-sm">
                            Enviar
                        </button>
                    </div>

                    <!-- Ja tinc compte link -->
                    <div class="pt-1">
                        <a href="login.html" class="text-xs text-colorTitol hover:text-colorPrimary-hover underline underline-offset-2 transition-colors">
                            Ja tinc compte
                        </a>
                    </div>
                </form>
            </div>

        <!-- RIGHT COLUMN: IMAGE CARD -->
        <div class="w-full h-full min-h-[460px] rounded-3xl overflow-hidden shadow-sm">
            <img src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?q=80&w=1000&auto=format&fit=crop" 
                alt="Taller de joieria i poliment d'un anell de diamants" 
                class="w-full h-full object-cover object-center"/>
        </div>

        </div>
    </main>

    <footer class="w-full border-t border-colorBorderDark/50 mt-12 pt-12 pb-8 px-6 md:px-12">
    </footer>

</body>

</html>
